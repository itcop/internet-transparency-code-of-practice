name: Deploy to itcop.org

# The site is a Cloudflare Pages project in Direct Upload mode. Cloudflare will
# not convert it to a git-connected project, and the Cloudflare GitHub App is not
# installed on the itcop organisation, so commits do not reach the site on their
# own. This workflow is what closes that gap.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'PROCESS.md'
      - 'LICENSE.md'
      - 'CONTRIBUTING.md'
      - 'DEPLOY.md'
      - 'MRT-DEPLOY.md'
      - 'SPEC-*.md'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: deploy-itcop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the deploy credential is missing
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."
            echo "Create a Cloudflare API token scoped to Account > Cloudflare Pages > Edit"
            echo "on account ed9b6757db93df52c9e2dd2c1606a594, then add it as a repository"
            echo "secret named CLOUDFLARE_API_TOKEN. Do not reuse a token that also carries"
            echo "DNS or Workers scope. See DEPLOY.md."
            exit 1
          fi

      - name: Stage the public tree
        run: |
          # Repository governance files are not part of the published site.
          mkdir -p /tmp/itcop-stage
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='scripts' \
            --exclude='node_modules' --exclude='package.json' --exclude='bun.lockb' \
            --exclude='README.md' --exclude='PROCESS.md' --exclude='LICENSE.md' \
            --exclude='CONTRIBUTING.md' --exclude='DEPLOY.md' --exclude='MRT-DEPLOY.md' \
            --exclude='SPEC-*.md' --exclude='.gitignore' --exclude='paper-gate.worker.js' \
            --exclude='.DS_Store' \
            ./ /tmp/itcop-stage/
          test -f /tmp/itcop-stage/_headers || { echo "::error::_headers missing from the staged tree"; exit 1; }

      - name: Stamp the asset version
        run: |
          # app.js is served with max-age=14400, so without a fresh query string a
          # corrected file reaches the origin but not the browser for four hours.
          # No token in use has cache-purge scope, so the query string is the
          # mechanism. Stamped in the staging tree, never committed back.
          STAMP="${GITHUB_SHA::12}"
          perl -pi -e "s/(app\.js|styles\.css)\?v=[^\"']*/\$1?v=$STAMP/g" /tmp/itcop-stage/index.html
          grep -o '?v=[^"]*' /tmp/itcop-stage/index.html

      - name: Deploy with wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ed9b6757db93df52c9e2dd2c1606a594
          command: pages deploy /tmp/itcop-stage --project-name=itcop-org --branch=main

      - name: Verify what is actually live
        run: |
          sleep 10
          fail=0
          check() {
            read -r code type < <(curl -sL -o /dev/null -w "%{http_code} %{content_type}" "https://itcop.org$1?cb=$RANDOM")
            printf '%-34s %s %s\n' "$1" "$code" "$type"
            [ "$code" = "200" ] || fail=1
            case "$type" in *"$2"*) ;; *) fail=1 ;; esac
          }
          check /                          text/html
          check /paper/                    text/html
          check /licence/0pn-mrt-1.0.json  application/ld+json
          check /licence/0pn-mrt-1.0.txt   text/plain
          check /.well-known/tdmrep.json   application/json
          check /reuse/evidence/           text/html

          # The paper gate must refuse an unacknowledged request rather than serve
          # anything. 403 is the healthy answer here, not 200. Checked in both
          # forms because an exact route does not match a URL carrying a query
          # string: until the route was widened to /paper/read*, appending one
          # fell through to Pages and returned the homepage with status 200.
          for u in "https://itcop.org/paper/read" "https://itcop.org/paper/read?cb=$RANDOM"; do
            gate=$(curl -s -o /dev/null -w "%{http_code}" "$u")
            printf '%-34s %s\n' "${u#https://itcop.org}" "$gate"
            [ "$gate" = "403" ] || { echo "::error::paper gate should refuse with 403, got $gate for $u"; fail=1; }
          done

          # The reuse terms travel with the page, so assert the headers too.
          curl -sI "https://itcop.org/" | grep -qi '^tdm-reservation: 1' || { echo "::error::tdm-reservation header missing"; fail=1; }
          curl -sI "https://itcop.org/" | grep -qi '^tdm-policy:' || { echo "::error::tdm-policy header missing"; fail=1; }

          exit $fail
