<svg xmlns="http://www.w3.org/2000/svg" width="384" height="112" viewBox="0 0 384 112" role="img" aria-label="ITCOP — Internet Transparency Code of Practice">
  <title>ITCOP — Internet Transparency Code of Practice</title>
  <!-- Fused ITCOP mark (locked): green fir canopy on a navy signpost trunk,
       navy directional blade with a white node. viewBox 0..64, scaled to 84px, centred vertically. -->
  <g transform="translate(6,14) scale(1.3125)">
    <rect x="29" y="12" width="6" height="40" rx="3" fill="#0C293C"/>
    <path d="M32 12 46 27h-8L32 20z" fill="#468D32"/>
    <path d="M32 12 18 27h8L32 20z" fill="#468D32"/>
    <path d="M32 24 48 40H38L32 33z" fill="#468D32"/>
    <path d="M32 24 16 40h10L32 33z" fill="#468D32"/>
    <path d="M35 39h13l6 6-6 6H35z" fill="#0C293C"/>
    <circle cx="43.5" cy="45" r="2.5" fill="#fff"/>
  </g>
  <!-- Wordmark: ITCOP in a serif face (matches the Fraunces intent with a system-serif fallback). -->
  <text x="122" y="52"
        font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif"
        font-size="40" font-weight="600" letter-spacing="1"
        fill="#0C293C">ITCOP</text>
  <!-- Full descriptor beneath, sans-serif for legibility. -->
  <text x="123" y="80"
        font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14.5" font-weight="500" letter-spacing="0.2"
        fill="#233743">Internet Transparency Code of Practice</text>
</svg>
