      <path d="M120 120 L135.31 156.96 L120 202 Z"/>
      <path d="M120 120 L104.69 156.96 L62.02 177.98 Z"/>
      <path d="M120 120 L83.04 135.31 L38 120 Z"/>
      <path d="M120 120 L83.04 104.69 L62.02 62.02 Z"/>
      <path d="M120 120 L104.69 83.04 L120 38 Z"/>
    </g>
    <g fill="#0B2A4A">
      <path d="M120 120 L120 38 L135.31 83.04 Z"/>
      <path d="M120 120 L177.98 62.02 L156.96 104.69 Z"/>
      <path d="M120 120 L202 120 L156.96 135.31 Z"/>
      <path d="M120 120 L177.98 177.98 L135.31 156.96 Z"/>
      <path d="M120 120 L120 202 L104.69 156.96 Z"/>
      <path d="M120 120 L62.02 177.98 L83.04 135.31 Z"/>
