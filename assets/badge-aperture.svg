      <path d="M120 120 L177.98 62.02"/>
      <path d="M120 120 L202 120"/>
      <path d="M120 120 L177.98 177.98"/>
      <path d="M120 120 L120 202"/>
      <path d="M120 120 L62.02 177.98"/>
      <path d="M120 120 L38 120"/>
      <path d="M120 120 L62.02 62.02"/>
